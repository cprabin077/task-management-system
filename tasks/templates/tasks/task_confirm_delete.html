{% extends "base.html" %}

{% block title %}
Delete Task
{% endblock %}


{% block content %}

<div class="confirm-card">

    <h1>Delete Task?</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ task.title }}</strong>?
    </p>

    <p>
        This action cannot be undone.
    </p>


    <form method="post">

        {% csrf_token %}

        <div class="form-actions">

            <a
                href="{% url 'task_detail' task.pk %}"
                class="btn-secondary"
            >
                Cancel
            </a>


            <button
                type="submit"
                class="btn-danger"
            >
                Delete Task
            </button>

        </div>

    </form>

</div>

{% endblock %}
