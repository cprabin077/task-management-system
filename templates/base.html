{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Task Management
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body>

    <nav class="navbar">

        <div class="navbar-brand">

            <a href="{% url 'dashboard' %}">
                Task Management
            </a>

        </div>

        <div>

            {% if user.is_authenticated %}

                <span>
                    Welcome, {{ user.username }}
                </span>

                <form
                    method="post"
                    action="{% url 'logout' %}"
                    style="display:inline;"
                >

                    {% csrf_token %}

                    <button type="submit">
                        Logout
                    </button>

                </form>

            {% endif %}

        </div>

    </nav>


    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
