{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Login</h1>

        <p class="auth-subtitle">
            Login to your account
        </p>


        {% if form.errors %}

            <div class="error-message">
                Your username or password is incorrect.
            </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}

            <div class="form-group">

                <label for="id_username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="id_password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-primary full-width"
            >
                Login
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="{% url 'register' %}">
                Register
            </a>

        </p>

    </div>

</div>

{% endblock %}
